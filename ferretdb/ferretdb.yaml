name: "ferretdb2"
arch: "${ARCH}"
platform: "linux"
version: "v2.7.0"
release: "2"
version_schema: semver
description: A truly Open Source MongoDB alternative
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "FerretDB"
homepage: "https://github.com/FerretDB/FerretDB"
license: "Apache-2.0"

contents:

  - src: ferretdb.bin
    dst: /usr/bin/ferretdb
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/ferretdb2/LICENSE
    file_info:
      mode: 0644

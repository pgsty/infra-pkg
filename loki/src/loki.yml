# This is a configuration to deploy Loki depending only on a storage solution
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA}/chunks
      rules_directory: ${LOKI_DATA}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  wal:
    enabled: true
    dir: ${LOKI_DATA}/wal
    flush_on_shutdown: true     # Flush any ingested but not yet flushed chunks when loki shuts down
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h       # Any chunk not receiving new logs in this time will be flushed
  max_chunk_age: 1h           # All chunks will be flushed when they hit this age, default is 1h
  chunk_target_size: 1048576  # Loki will attempt to build chunks up to 1.5MB, flushing first if chunk_idle_period or max_chunk_age is reached first

# define data schema
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# increase resource limit
# https://grafana.com/docs/loki/latest/configuration/#limits_config
limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  split_queries_by_interval: 5m
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 64
  max_entries_limit_per_query: 50000
  max_chunks_per_query: 10000000
  max_query_series: 32768

# cache query results in memory
query_range:
  align_queries_with_step: true
  parallelise_shardable_queries: false
  max_retries: 3
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# increase frontend limits
frontend:
  max_outstanding_per_tenant: 8192

# TSDB retention and compaction
compactor:
  working_directory: ${LOKI_DATA}/compactor
  retention_enabled: true
  delete_request_store: filesystem

# disable telemetry reporting
analytics:
  reporting_enabled: false

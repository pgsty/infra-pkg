name: "xray"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "26.3.27"
release: "1PGSTY"
version_schema: semver
description: Xray-core is a powerful platform for anti-censorship.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/XTLS/Xray-core"
license: "MPL-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: xray/xray
    dst: /usr/bin/xray
    file_info:
      mode: 0755

  # configuration
  - src: src/config.json
    dst: /etc/xray.json
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: xray

  # service
  - src: src/xray.service
    dst: /usr/lib/systemd/system/xray.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # assets
  - src: xray/geoip.dat
    dst: /usr/share/xray/geoip.dat
    file_info:
      mode: 0644

  - src: xray/geosite.dat
    dst: /usr/share/xray/geosite.dat
    file_info:
      mode: 0644

  # logs
  - dst: /var/log/xray
    type: dir
    file_info:
      mode: 0750
      owner: xray
      group: xray

  - dst: /var/log/xray/access.log
    type: ghost
    file_info:
      mode: 0640
      owner: xray
      group: xray

  - dst: /var/log/xray/error.log
    type: ghost
    file_info:
      mode: 0640
      owner: xray
      group: xray

  # documentation
  - src: xray/LICENSE
    dst: /usr/share/doc/xray/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/xray/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

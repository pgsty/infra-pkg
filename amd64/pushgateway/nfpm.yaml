name: "pushgateway"
arch: "amd64"
platform: "linux"
version: "v1.11.3"
release: "2"
version_schema: semver
description: Prometheus pushgateway
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "Prometheus"
homepage: "https://github.com/prometheus/pushgateway"
license: "Apache-2.0"

contents:

  # binaries
  - src: pushgateway/pushgateway
    dst: /usr/bin/pushgateway
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/pushgateway
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/pushgateway.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: pushgateway/LICENSE
    dst: /usr/share/doc/pushgateway/LICENSE
    file_info:
      mode: 0644

  - src: pushgateway/NOTICE
    dst: /usr/share/doc/pushgateway/NOTICE
    file_info:
      mode: 0644

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

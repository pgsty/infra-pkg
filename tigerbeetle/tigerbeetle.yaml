name: "tigerbeetle"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v0.17.9"
release: "1PGSTY"
version_schema: semver
description: The financial transactions database designed for mission critical safety and performance
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/tigerbeetle/tigerbeetle"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: tigerbeetle
    dst: /usr/bin/tigerbeetle
    file_info:
      mode: 0755

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/tigerbeetle/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/tigerbeetle/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "pushgateway"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v1.11.3"
release: "1PGSTY"
version_schema: semver
description: Prometheus pushgateway
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/prometheus/pushgateway"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: pushgateway/pushgateway
    dst: /usr/bin/pushgateway
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/pushgateway
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/pushgateway.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # state
  - dst: /var/lib/pushgateway
    type: dir
    file_info:
      mode: 0750
      owner: prometheus
      group: prometheus

  # documentation
  - src: pushgateway/LICENSE
    dst: /usr/share/doc/pushgateway/LICENSE
    file_info:
      mode: 0644

  - src: pushgateway/NOTICE
    dst: /usr/share/doc/pushgateway/NOTICE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/pushgateway/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

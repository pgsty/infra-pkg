name: "codex"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "0.155.1"
release: "1PGSTY"
version_schema: semver
description: OpenAI coding agent CLI
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/openai/codex"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr

contents:
  - src: codex/codex
    dst: /usr/bin/codex
    file_info:
      mode: 0755

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/codex/LICENSE
    file_info:
      mode: 0644

  - src: NOTICE
    dst: /usr/share/doc/codex/NOTICE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/codex/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "v2ray"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v5.52.0"
release: "1PGSTY"
version_schema: semver
description: A platform for building proxies to bypass network restrictions.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/v2fly/v2ray-core"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: v2ray/v2ray
    dst: /usr/bin/v2ray
    file_info:
      mode: 0755

  # configuration
  - src: src/config.json
    dst: /etc/v2ray.json
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: v2ray

  # service
  - src: src/v2ray.service
    dst: /usr/lib/systemd/system/v2ray.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # assets
  - src: v2ray/geoip.dat
    dst: /usr/share/v2ray/geoip.dat
    file_info:
      mode: 0644

  - src: v2ray/geosite.dat
    dst: /usr/share/v2ray/geosite.dat
    file_info:
      mode: 0644

  # logs
  - dst: /var/log/v2ray
    type: dir
    file_info:
      mode: 0750
      owner: v2ray
      group: v2ray

  - dst: /var/log/v2ray/access.log
    type: ghost
    file_info:
      mode: 0640
      owner: v2ray
      group: v2ray

  - dst: /var/log/v2ray/error.log
    type: ghost
    file_info:
      mode: 0640
      owner: v2ray
      group: v2ray

  # documentation
  - src: src/LICENSE
    dst: /usr/share/doc/v2ray/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/v2ray/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

name: "ferretdb"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v2.7.0"
release: "1PGSTY"
version_schema: semver
description: A truly Open Source MongoDB alternative
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/FerretDB/FerretDB"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  - src: ferretdb.bin
    dst: /usr/bin/ferretdb
    file_info:
      mode: 0755

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/ferretdb/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/ferretdb/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

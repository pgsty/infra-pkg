name: "pg-exporter"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v1.4.1"
release: "1PGSTY"
version_schema: semver
description: |
  Prometheus exporter for PostgreSQL / Pgbouncer server metrics.
  Supported version: Postgres9.x - 19+ & Pgbouncer 1.8 - 1.25+
  Part of Project Pigsty -- Battery Included PostgreSQL Distribution
  with ultimate observability support: https://pigsty.io/docs/pg_exporter
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://pigsty.io/docs/pg_exporter"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: pg_exporter/pg_exporter
    dst: /usr/bin/pg_exporter
    file_info:
      mode: 0755

  # configuration
  - src: pg_exporter/pg_exporter.yml
    dst: /etc/pg_exporter.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: prometheus

  - src: pg_exporter/package/pg_exporter.default
    dst: /etc/default/pg_exporter
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  # service
  - src: pg_exporter/package/pg_exporter.service
    dst: /usr/lib/systemd/system/pg_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: pg_exporter/LICENSE
    dst: /usr/share/doc/pg-exporter/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/pg-exporter/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

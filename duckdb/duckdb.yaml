name: "duckdb"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v1.5.5"
release: "1PGSTY"
version_schema: semver
description: In-process SQL OLAP Database Management System
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/duckdb/duckdb"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: duckdb
    dst: /usr/bin/duckdb
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/duckdb/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/duckdb/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

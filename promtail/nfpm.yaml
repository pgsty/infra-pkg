name: "promtail"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v3.6.7"
release: "1PGSTY"
version_schema: semver
description: Promtail Logging Agent
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: https://github.com/grafana/loki
license: "AGPL-3.0-only"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: promtail/promtail.bin
    dst: /usr/bin/promtail
    file_info:
      mode: 0755

  # configuration
  - src: src/promtail.yml
    dst: /etc/promtail.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  - src: src/default
    dst: /etc/default/promtail
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/promtail.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # state (promtail runs as root so it can read system logs)
  - dst: /var/lib/promtail
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: root

  # documentation
  - src: ../LICENSES/AGPL-3.0.txt
    dst: /usr/share/doc/promtail/LICENSE
    file_info:
      mode: 0644

  - src: src/LICENSING.md
    dst: /usr/share/doc/promtail/LICENSING.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/promtail/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

overrides:
  deb:
    depends:
      - "libc6 (>= 2.34)"
  rpm:
    depends:
      - "glibc >= 2.34"

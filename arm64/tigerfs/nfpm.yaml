name: "tigerfs"
arch: "arm64"
platform: "linux"
version: "v0.7.0"
release: "2"
version_schema: semver
description: Mount PostgreSQL as a filesystem. Build apps with files, explore databases with ls and cat.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "Timescale"
homepage: "https://tigerfs.io/"
license: "MIT"

depends:
  - fuse3

contents:
  - src: tigerfs/tigerfs
    dst: /usr/bin/tigerfs
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/tigerfs/LICENSE
    file_info:
      mode: 0644

  - src: tigerfs/README.md
    dst: /usr/share/doc/tigerfs/README.md
    file_info:
      mode: 0644

  - src: tigerfs/docs/spec.md
    dst: /usr/share/doc/tigerfs/spec.md
    file_info:
      mode: 0644

overrides:
  rpm:
    depends:
      - fuse
      - fuse3

name: "mtail"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v3.4.12"
release: "1PGSTY"
version_schema: semver
description: extract internal monitoring data from application logs for collection in a timeseries database
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/jaqx0r/mtail"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  - src: mtail
    dst: /usr/bin/mtail
    file_info:
      mode: 0755

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/mtail/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/mtail/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "victoria-metrics"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v1.152.0"
release: "1PGSTY"
version_schema: semver
description: fast, cost-effective monitoring solution and time series database
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/VictoriaMetrics/VictoriaMetrics"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: victoria-metrics/victoria-metrics-prod
    dst: /usr/bin/victoria-metrics
    file_info: { mode: 0755 }

  - src: LICENSE
    dst: /usr/share/doc/victoria-metrics/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/victoria-metrics/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

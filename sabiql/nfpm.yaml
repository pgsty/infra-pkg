name: "sabiql"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v1.15.1"
release: "1PGSTY"
version_schema: semver
description: A modern SQL client for PostgreSQL.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/riii111/sabiql"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: sabiql/sabiql
    dst: /usr/bin/sabiql
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/sabiql/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/sabiql/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

overrides:
  deb:
    depends:
      - postgresql-client
      - "libc6 (>= 2.39)"
  rpm:
    depends:
      - postgresql
      - "glibc >= 2.39"

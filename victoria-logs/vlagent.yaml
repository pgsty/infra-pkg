name: "vlagent"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v1.52.0"
release: "1PGSTY"
version_schema: semver
description: A tiny agent which helps you collect logs from various sources and store them in VictoriaLogs
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://docs.victoriametrics.com/victorialogs/vlagent/"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: victoria-logs/vlagent-prod
    dst: /usr/bin/vlagent
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/vlagent/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/vlagent/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

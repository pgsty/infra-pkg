name: "npgsqlrest"
arch: "amd64"
platform: "linux"
version: "v3.21.0"
release: "2"
version_schema: semver
description: NpgsqlRest automatically generates REST API from PostgreSQL database.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "NpgsqlRest"
homepage: "https://github.com/NpgsqlRest/NpgsqlRest"
license: "MIT"

contents:

  # binaries
  - src: npgsqlrest/npgsqlrest
    dst: /usr/bin/npgsqlrest
    file_info:
      mode: 0755

  # configuration
  - dst: /etc/npgsqlrest
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: npgsqlrest

  - src: src/appsettings.json
    dst: /etc/npgsqlrest/appsettings.json
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: npgsqlrest

  - src: src/default
    dst: /etc/default/npgsqlrest
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/npgsqlrest.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: src/LICENSE
    dst: /usr/share/doc/npgsqlrest/LICENSE
    file_info:
      mode: 0644

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

overrides:
  deb:
    depends:
      - "libc6 (>= 2.34)"
  rpm:
    depends:
      - "glibc >= 2.34"

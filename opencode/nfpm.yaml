name: "opencode"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "v1.19.6"
release: "1PGSTY"
version_schema: semver
description: Open-source AI coding assistant
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/anomalyco/opencode"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr

# Without rg on PATH, opencode downloads ripgrep from GitHub on first use,
# which fails on air-gapped hosts. Weak dependency: EL needs EPEL for it.
overrides:
  deb:
    recommends:
      - ripgrep
  rpm:
    recommends:
      - ripgrep

contents:
  - src: opencode/opencode
    dst: /usr/bin/opencode
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/opencode/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/opencode/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

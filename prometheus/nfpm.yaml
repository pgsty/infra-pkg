name: "prometheus"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v3.14.0"
release: "1PGSTY"
version_schema: semver
description: The Prometheus monitoring system and time series database.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/prometheus/prometheus"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: prometheus/prometheus
    dst: /usr/bin/prometheus
    file_info:
      mode: 0755

  - src: prometheus/promtool
    dst: /usr/bin/promtool
    file_info:
      mode: 0755

  # configuration
  - dst: /etc/prometheus/
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: prometheus

  - src: prometheus/prometheus.yml
    dst: /etc/prometheus/prometheus.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: prometheus

  - src: src/default
    dst: /etc/default/prometheus
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # Prometheus 3.x retains console support but no longer ships examples.
  # Vendor the final upstream example set from Prometheus v2.55.1.
  - src: src/console_libraries/
    dst: /usr/share/prometheus/console_libraries/
    type: tree

  - src: src/consoles/
    dst: /usr/share/prometheus/consoles/
    type: tree

  # data
  - dst: /var/lib/prometheus/
    type: dir
    file_info:
      mode: 0750
      owner: prometheus
      group: prometheus

  - src: src/service
    dst: /usr/lib/systemd/system/prometheus.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: prometheus/LICENSE
    dst: /usr/share/doc/prometheus/LICENSE
    file_info:
      mode: 0644

  - src: prometheus/NOTICE
    dst: /usr/share/doc/prometheus/NOTICE
    file_info:
      mode: 0644

  - src: src/CONSOLES.md
    dst: /usr/share/doc/prometheus/CONSOLES.md
    file_info:
      mode: 0644

# add prometheus user/group

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/prometheus/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

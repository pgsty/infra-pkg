name: "grafana-victoriametrics-ds"
arch: "${ARCH}"
platform: "linux"
section: "web"
priority: "optional"
version: "0.26.1"
release: "1PGSTY"
version_schema: semver
description: "Grafana datasource for VictoriaMetrics"
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/VictoriaMetrics/victoriametrics-datasource"
license: "AGPL-3.0-only"
changelog: "${NFPM_CHANGELOG}"

overrides:
  deb:
    depends:
      - grafana (>= 11.6.11)
      - grafana (<< 12) | grafana (>= 12.0.10)
      - grafana (<< 12.1) | grafana (>= 12.1.7)
      - grafana (<< 12.2) | grafana (>= 12.2.5)
  rpm:
    depends:
      - grafana >= 11.6.11
      - (grafana < 12 or grafana >= 12.0.10)
      - (grafana < 12.1 or grafana >= 12.1.7)
      - (grafana < 12.2 or grafana >= 12.2.5)

contents:

  - dst: /var/lib/grafana/
    type: dir
    file_info:
      mode: 0755
      owner: grafana
      group: grafana

  - dst: /var/lib/grafana/plugins/
    type: dir
    file_info:
      mode: 0755
      owner: grafana
      group: grafana

  - src: victoriametrics-metrics-datasource/
    dst: /var/lib/grafana/plugins/victoriametrics-metrics-datasource/
    type: tree
    file_info:
      owner: grafana
      group: grafana

  - src: victoriametrics-metrics-datasource/LICENSE
    dst: /usr/share/doc/grafana-victoriametrics-ds/LICENSE
    file_info:
      mode: 0644

  - src: NOTICE.md
    dst: /usr/share/doc/grafana-victoriametrics-ds/NOTICE.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/grafana-victoriametrics-ds/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

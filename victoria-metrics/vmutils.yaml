name: "vmutils"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v1.152.0"
release: "1PGSTY"
version_schema: semver
description: fast, cost-effective monitoring solution and time series database, agent,alert,auth,backup,restore,ctl
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/VictoriaMetrics/VictoriaMetrics"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: victoria-metrics/vmagent-prod
    dst: /usr/bin/vmagent
    file_info: { mode: 0755 }
  - src: victoria-metrics/vmalert-prod
    dst: /usr/bin/vmalert
    file_info: { mode: 0755 }
  - src: victoria-metrics/vmalert-tool-prod
    dst: /usr/bin/vmalert-tool
    file_info: { mode: 0755 }
  - src: victoria-metrics/vmauth-prod
    dst: /usr/bin/vmauth
    file_info: { mode: 0755 }
  - src: victoria-metrics/vmbackup-prod
    dst: /usr/bin/vmbackup
    file_info: { mode: 0755 }
  - src: victoria-metrics/vmctl-prod
    dst: /usr/bin/vmctl
    file_info: { mode: 0755 }
  - src: victoria-metrics/vmrestore-prod
    dst: /usr/bin/vmrestore
    file_info: { mode: 0755 }
  - src: LICENSE
    dst: /usr/share/doc/vmutils/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/vmutils/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "mysqld-exporter"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v0.20.0"
release: "1PGSTY"
version_schema: semver
description: Prometheus exporter for MySQL server metrics.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/prometheus/mysqld_exporter"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: mysqld_exporter/mysqld_exporter
    dst: /usr/bin/mysqld_exporter
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/mysqld_exporter
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/mysqld_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: mysqld_exporter/LICENSE
    dst: /usr/share/doc/mysqld-exporter/LICENSE
    file_info:
      mode: 0644

  - src: mysqld_exporter/NOTICE
    dst: /usr/share/doc/mysqld-exporter/NOTICE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/mysqld-exporter/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

name: "rustfs"
arch: "amd64"
platform: "linux"
version: "1.0.0"
release: "b12"
version_schema: semver
description: RustFS is a high-performance, S3 compatible distributed object storage system
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "RustFS"
homepage: "https://github.com/rustfs/rustfs"
license: "Apache-2.0"

contents:

  # binaries
  - src: rustfs/rustfs
    dst: /usr/bin/rustfs
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/rustfs
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/rustfs.service
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: src/check-config.sh
    dst: /usr/libexec/rustfs/check-config
    file_info:
      mode: 0755
      owner: root
      group: root

  # data and logs
  - dst: /data/rustfs
    type: dir
    file_info:
      mode: 0750
      owner: rustfs
      group: rustfs

  - dst: /var/logs/rustfs
    type: dir
    file_info:
      mode: 0750
      owner: rustfs
      group: rustfs

  # documentation
  - src: src/LICENSE
    dst: /usr/share/doc/rustfs/LICENSE
    file_info:
      mode: 0644

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

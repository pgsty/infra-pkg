name: "stalwart"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v0.16.22"
release: "1PGSTY"
version_schema: semver
description: Stalwart Mail Server static musl binaries
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/stalwartlabs/stalwart"
license: "AGPL-3.0-only"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: stalwart/stalwart
    dst: /usr/bin/stalwart
    file_info:
      mode: 0755

  - src: ../LICENSES/AGPL-3.0.txt
    dst: /usr/share/doc/stalwart/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/stalwart/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

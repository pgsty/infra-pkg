name: "loki-canary"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v3.7.6"
release: "1PGSTY"
version_schema: semver
description: Synthetic log writer and reader for validating Loki availability
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: https://github.com/grafana/loki
license: "AGPL-3.0-only"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binary
  - src: loki-canary/loki-canary.bin
    dst: /usr/bin/loki-canary
    file_info:
      mode: 0755

  # documentation
  - src: ../LICENSES/AGPL-3.0.txt
    dst: /usr/share/doc/loki-canary/LICENSE
    file_info:
      mode: 0644

  - src: src/LICENSING.md
    dst: /usr/share/doc/loki-canary/LICENSING.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/loki-canary/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "alertmanager"
arch: "amd64"
platform: "linux"
version: "v0.33.1"
release: "2"
version_schema: semver
description: Prometheus Alertmanager
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "Prometheus"
homepage: "https://github.com/prometheus/alertmanager"
license: "Apache-2.0"

contents:

  # binaries
  - src: alertmanager/alertmanager
    dst: /usr/bin/alertmanager
    file_info:
      mode: 0755

  - src: alertmanager/amtool
    dst: /usr/bin/amtool
    file_info:
      mode: 0755

  # configuration
  - src: alertmanager/alertmanager.yml
    dst: /etc/alertmanager.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: prometheus

  - src: src/default
    dst: /etc/default/alertmanager
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/alertmanager.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: alertmanager/LICENSE
    dst: /usr/share/doc/alertmanager/LICENSE
    file_info:
      mode: 0644

  - src: alertmanager/NOTICE
    dst: /usr/share/doc/alertmanager/NOTICE
    file_info:
      mode: 0644

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

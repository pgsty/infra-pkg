name: "k3s-images"
arch: "${ARCH}"
platform: "linux"
section: "admin"
priority: "optional"
version: "1.36.4"
release: "1PGSTY"
version_schema: semver
description: "K3s v1.36.4+k3s1 system images for air-gapped nodes"
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/k3s-io/k3s"
license: "LicenseRef-K3s-Airgap-Bundle"
changelog: "${NFPM_CHANGELOG}"

overrides:
  deb:
    depends:
      - k3s (= 1.36.4-1PGSTY)
  rpm:
    depends:
      - k3s = 1.36.4-1PGSTY

contents:

  # image archive
  - dst: /var/lib/rancher/k3s/agent/images/
    type: dir
    file_info:
      mode: 0755

  - src: k3s-airgap-images.tar.zst
    dst: /var/lib/rancher/k3s/agent/images/k3s-airgap-images.tar.zst
    file_info:
      mode: 0644

  # documentation
  - src: k3s-images.txt
    dst: /usr/share/doc/k3s-images/k3s-images.txt
    file_info:
      mode: 0644

  - src: sha256sum.txt
    dst: /usr/share/doc/k3s-images/sha256sum.txt
    file_info:
      mode: 0644

  - src: AIRGAP.md
    dst: /usr/share/doc/k3s-images/AIRGAP.md
    file_info:
      mode: 0644

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/k3s-images/LICENSE.k3s
    file_info:
      mode: 0644

  - src: src/LICENSES.md
    dst: /usr/share/doc/k3s-images/LICENSES.md
    file_info:
      mode: 0644

# package compression (payload is already zstd-compressed)

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/k3s-images/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

deb:
  compression: none

rpm:
  compression: zstd:1

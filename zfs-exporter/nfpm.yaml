name: "zfs-exporter"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v3.8.1"
release: "1PGSTY"
version_schema: semver
description: Prometheus exporter for zfs metrics
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/waitingsong/zfs_exporter"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: zfs_exporter/zfs_exporter
    dst: /usr/bin/zfs_exporter
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/zfs_exporter
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/zfs_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: zfs_exporter/LICENSE
    dst: /usr/share/doc/zfs-exporter/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/zfs-exporter/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

name: "claude"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "2.1.252"
release: "1PGSTY"
version_schema: semver
description: Anthropic's official CLI for Claude
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/anthropics/claude-code"
license: "LicenseRef-Anthropic-Commercial"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr

contents:
  - src: claude
    dst: /usr/bin/claude
    file_info:
      mode: 0755

  - src: LICENSE.md
    dst: /usr/share/doc/claude/LICENSE.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/claude/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

overrides:
  deb:
    depends:
      - "libc6 (>= 2.17)"
  rpm:
    depends:
      - "glibc >= 2.17"

name: "agentsview"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "0.43.0"
release: "1PGSTY"
version_schema: semver
description: Browse, search, and track costs across all your AI coding agents.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/kenn-io/agentsview"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr

contents:
  - src: agentsview/agentsview
    dst: /usr/bin/agentsview
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/agentsview/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/agentsview/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

overrides:
  deb:
    depends:
      - "libc6 (>= 2.28)"
      - "libstdc++6"
  rpm:
    depends:
      - "glibc >= 2.28"
      - "libstdc++"

name: "sql-studio"
arch: "${ARCH}"
platform: "linux"
version: "v0.1.51"
release: "1"
version_schema: semver
description: Terminal SQL database explorer for PostgreSQL, MySQL, SQLite, ClickHouse, and more.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "frectonz"
homepage: "https://github.com/frectonz/sql-studio"
license: "MIT"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: sql-studio/sql-studio
    dst: /usr/bin/sql-studio
    file_info:
      mode: 0755

  - src: sql-studio/LICENSE
    dst: /usr/share/doc/sql-studio/LICENSE
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - "libc6 (>= 2.34)"
      - "libstdc++6 (>= 11)"
  rpm:
    depends:
      - "glibc >= 2.34"
      - "libstdc++ >= 11"

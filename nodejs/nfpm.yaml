name: "nodejs"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "v26.13.1"
version_schema: semver
# EL AppStream ships nodejs with epoch 1, which outranks any epoch-less build
# regardless of version; without this, `dnf install nodejs` picks Node 10/16/22.
# RPM only: bin/render_debian_docs.py drops the epoch from DEB builds.
epoch: 2
release: "1PGSTY"
description: Node.js JavaScript runtime
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://nodejs.org"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

overrides:
  deb:
    depends:
      - libatomic1
  rpm:
    depends:
      - libatomic

contents:
  - src: node/
    dst: /usr/lib/nodejs

  # Keep global npm installs in the administrator-managed local prefix.
  - src: npmrc
    dst: /usr/lib/nodejs/lib/node_modules/npm/npmrc
    file_info:
      mode: 0644

  - src: node/LICENSE
    dst: /usr/share/doc/nodejs/LICENSE
    file_info:
      mode: 0644

  - src: ../lib/nodejs/bin/node
    dst: /usr/bin/node
    type: symlink
  - src: ../lib/nodejs/bin/node
    dst: /usr/bin/nodejs
    type: symlink
  - src: ../lib/nodejs/bin/npm
    dst: /usr/bin/npm
    type: symlink
  - src: ../lib/nodejs/bin/npx
    dst: /usr/bin/npx
    type: symlink
  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/nodejs/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "pgbot"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "0.9.0"
release: "1PGSTY"
version_schema: semver
description: |
  PostgreSQL diagnostics CLI with baseline comparisons, JSON output and MCP.
  Core diagnostics run locally without an AI model or a PGRun account.
  Connects to local or remote PostgreSQL; no database server is included.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/pgrundev/pgbot"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: pgbot/pgbot
    dst: /usr/bin/pgbot
    file_info:
      mode: 0755

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/pgbot/LICENSE
    file_info:
      mode: 0644

  # Upstream ships an abbreviated license notice; preserve it verbatim.
  - src: pgbot/LICENSE
    dst: /usr/share/doc/pgbot/NOTICE
    file_info:
      mode: 0644

  - src: pgbot/README.md
    dst: /usr/share/doc/pgbot/README.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/pgbot/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "codex"
arch: "amd64"
platform: "linux"
version: "0.146.0"
release: "2"
version_schema: semver
description: OpenAI coding agent CLI
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "OpenAI"
homepage: "https://github.com/openai/codex"
license: "Apache-2.0"

rpm:
  prefixes:
    - /usr

contents:
  - src: codex/codex
    dst: /usr/bin/codex
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/codex/LICENSE
    file_info:
      mode: 0644

  - src: NOTICE
    dst: /usr/share/doc/codex/NOTICE
    file_info:
      mode: 0644

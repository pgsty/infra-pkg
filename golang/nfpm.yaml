name: "golang"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "v1.27.1"
version_schema: semver
release: "1PGSTY"
description: The Go Programming Language
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://go.dev"
license: "BSD-3-Clause"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: go/
    dst: /usr/lib/go

  - src: go/LICENSE
    dst: /usr/share/doc/golang/LICENSE
    file_info:
      mode: 0644

  - src: ../lib/go/bin/go
    dst: /usr/bin/go
    type: symlink

  - src: ../lib/go/bin/gofmt
    dst: /usr/bin/gofmt
    type: symlink

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/golang/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

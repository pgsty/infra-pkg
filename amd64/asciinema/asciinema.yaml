name: "asciinema"
arch: "amd64"
platform: "linux"
version: "3.2.1"
release: "2"
version_schema: semver
description: Terminal session recorder, streamer, and player
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "asciinema"
homepage: "https://github.com/asciinema/asciinema"
license: "GPL-3.0-or-later"

rpm:
  prefixes:
    - /usr

contents:
  - src: asciinema-x86_64-unknown-linux-musl
    dst: /usr/bin/asciinema
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/asciinema/LICENSE
    file_info:
      mode: 0644

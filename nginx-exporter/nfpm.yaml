name: "nginx-exporter"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v1.5.3"
release: "1PGSTY"
version_schema: semver
description: NGINX Prometheus Exporter for NGINX and NGINX Plus.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/nginx/nginx-prometheus-exporter"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: nginx_exporter/nginx-prometheus-exporter
    dst: /usr/bin/nginx_exporter
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/nginx_exporter
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/nginx_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: nginx_exporter/LICENSE
    dst: /usr/share/doc/nginx-exporter/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/nginx-exporter/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

name: "seaweedfs"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "4.45"
release: "1PGSTY"
version_schema: semver
description: SeaweedFS is a fast distributed storage system for blobs, objects, files, and data lake
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/seaweedfs/seaweedfs"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: seaweedfs/weed
    dst: /usr/bin/weed
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/seaweedfs/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/seaweedfs/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

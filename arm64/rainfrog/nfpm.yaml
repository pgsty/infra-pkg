name: "rainfrog"
arch: "arm64"
platform: "linux"
version: "v0.4.2"
release: "2"
version_schema: semver
description: Database tool for the terminal.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "achristmascarl"
homepage: "https://github.com/achristmascarl/rainfrog"
license: "MIT"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: rainfrog/rainfrog
    dst: /usr/bin/rainfrog
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/rainfrog/LICENSE
    file_info:
      mode: 0644

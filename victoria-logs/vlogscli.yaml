name: "vlogscli"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v1.52.0"
release: "1PGSTY"
version_schema: semver
description: vlogscli is an interactive command-line tool for querying VictoriaLogs.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://docs.victoriametrics.com/victorialogs/querying/vlogscli/"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

depends:
  - less

contents:
  - src: victoria-logs/vlogscli-prod
    dst: /usr/bin/vlogscli
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/vlogscli/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/vlogscli/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "node-exporter"
arch: "${ARCH}"
platform: "linux"
version: "v1.12.1"
release: "2"
version_schema: semver
description: Prometheus exporter for machine metrics
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "Prometheus"
homepage: "https://github.com/prometheus/node_exporter"
license: "Apache-2.0"

contents:

  # binaries
  - src: node_exporter/node_exporter
    dst: /usr/bin/node_exporter
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/node_exporter
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/node_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: node_exporter/LICENSE
    dst: /usr/share/doc/node-exporter/LICENSE
    file_info:
      mode: 0644

  - src: node_exporter/NOTICE
    dst: /usr/share/doc/node-exporter/NOTICE
    file_info:
      mode: 0644

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

overrides:
  rpm:
    provides:
      - node_exporter
    replaces:
      - node_exporter

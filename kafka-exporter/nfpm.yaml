name: "kafka-exporter"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v1.9.0"
release: "1PGSTY"
version_schema: semver
description: Prometheus Exporter for Kafka
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/danielqsj/kafka_exporter"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: kafka_exporter/kafka_exporter
    dst: /usr/bin/kafka_exporter
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/kafka_exporter
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/kafka_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: kafka_exporter/LICENSE
    dst: /usr/share/doc/kafka-exporter/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/kafka-exporter/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

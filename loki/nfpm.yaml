name: "loki"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v3.6.7"
release: "1PGSTY"
version_schema: semver
description: Loki Logging Service
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: https://github.com/grafana/loki
license: "AGPL-3.0-only"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: loki/loki.bin
    dst: /usr/bin/loki
    file_info:
      mode: 0755

  # configuration
  - src: src/loki.yml
    dst: /etc/loki.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: loki

  - src: src/loki.default
    dst: /etc/default/loki
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # data
  - dst: /var/lib/loki/
    type: dir
    file_info:
      mode: 0750
      owner: loki
      group: loki

  # service
  - src: src/loki.service
    dst: /usr/lib/systemd/system/loki.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: ../LICENSES/AGPL-3.0.txt
    dst: /usr/share/doc/loki/LICENSE
    file_info:
      mode: 0644

  - src: src/LICENSING.md
    dst: /usr/share/doc/loki/LICENSING.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/loki/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

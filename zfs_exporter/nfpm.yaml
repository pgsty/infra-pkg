name: "zfs-exporter"
arch: "${ARCH}"
platform: "linux"
version: "v3.8.1"
release: "2"
version_schema: semver
description: Prometheus exporter for zfs metrics
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "Peter Fern / Waitingsong"
homepage: "https://github.com/waitingsong/zfs_exporter"
license: "MIT"

contents:

  # binaries
  - src: zfs_exporter/zfs_exporter
    dst: /usr/bin/zfs_exporter
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/zfs_exporter
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/zfs_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: zfs_exporter/LICENSE
    dst: /usr/share/doc/zfs-exporter/LICENSE
    file_info:
      mode: 0644

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

overrides:
  rpm:
    provides:
      - zfs_exporter
    replaces:
      - zfs_exporter

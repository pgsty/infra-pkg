name: "grafana-victorialogs-ds"
arch: "${ARCH}"
platform: "linux"
section: "web"
priority: "optional"
version: "0.32.0"
release: "1PGSTY"
version_schema: semver
description: "Grafana datasource for VictoriaLogs"
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/VictoriaMetrics/victorialogs-datasource"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

overrides:
  deb:
    depends:
      - grafana (>= 10.4.0)
  rpm:
    depends:
      - grafana >= 10.4.0

contents:

  - dst: /var/lib/grafana/
    type: dir
    file_info:
      mode: 0755
      owner: grafana
      group: grafana

  - dst: /var/lib/grafana/plugins/
    type: dir
    file_info:
      mode: 0755
      owner: grafana
      group: grafana

  - src: victoriametrics-logs-datasource/
    dst: /var/lib/grafana/plugins/victoriametrics-logs-datasource/
    type: tree
    file_info:
      owner: grafana
      group: grafana

  - src: victoriametrics-logs-datasource/LICENSE
    dst: /usr/share/doc/grafana-victorialogs-ds/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/grafana-victorialogs-ds/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

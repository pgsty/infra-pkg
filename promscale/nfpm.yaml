name: "promscale"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "0.17.0"
release: "1PGSTY"
version_schema: semver
description: |
  Deprecated Prometheus and OpenTelemetry backend for PostgreSQL/TimescaleDB.
  Obsolete and intentionally locked at the final upstream release, v0.17.0.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/timescale/promscale"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: promscale/promscale
    dst: /usr/bin/promscale
    file_info:
      mode: 0755

  - src: src/default
    dst: /etc/default/promscale
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: src/service
    dst: /usr/lib/systemd/system/promscale.service
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/promscale/LICENSE
    file_info:
      mode: 0644

  - src: ARCHIVED.md
    dst: /usr/share/doc/promscale/ARCHIVED.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/promscale/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

name: "tigerfs"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v0.7.0"
release: "1PGSTY"
version_schema: semver
description: Mount PostgreSQL as a filesystem. Build apps with files, explore databases with ls and cat.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://tigerfs.io/"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

depends:
  - fuse3

contents:
  - src: tigerfs/tigerfs
    dst: /usr/bin/tigerfs
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/tigerfs/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/tigerfs/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

overrides:
  rpm:
    depends:
      - fuse
      - fuse3

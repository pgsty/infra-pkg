name: "k3s"
arch: "${ARCH}"
platform: "linux"
section: "admin"
priority: "optional"
version: "1.36.4"
release: "1PGSTY"
version_schema: semver
description: "Lightweight Kubernetes, packaged from upstream v1.36.4+k3s1"
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/k3s-io/k3s"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

depends:
  - systemd

contents:

  # binaries
  - src: k3s
    dst: /usr/bin/k3s
    file_info:
      mode: 0755

  # configuration
  - dst: /etc/rancher/k3s/
    type: dir
    file_info:
      mode: 0700

  - dst: /etc/rancher/k3s/config.yaml.d/
    type: dir
    file_info:
      mode: 0700

  # service
  - src: src/k3s.service
    dst: /usr/lib/systemd/system/k3s.service
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: src/k3s-agent.service
    dst: /usr/lib/systemd/system/k3s-agent.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # scripts
  - src: src/k3s-killall.sh
    dst: /usr/bin/k3s-killall.sh
    file_info:
      mode: 0755

  # documentation
  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/k3s/LICENSE
    file_info:
      mode: 0644

  - src: src/PACKAGING.md
    dst: /usr/share/doc/k3s/PACKAGING.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/k3s/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  postinstall: src/postinstall.sh
  preremove: src/preremove.sh
  postremove: src/postremove.sh

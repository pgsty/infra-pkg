name: "mongodb-exporter"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v0.53.0"
release: "1PGSTY"
version_schema: semver
description: A Prometheus exporter for MongoDB including sharding, replication and storage engines
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/percona/mongodb_exporter"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: mongodb_exporter/mongodb_exporter
    dst: /usr/bin/mongodb_exporter
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/mongodb_exporter
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/mongodb_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: mongodb_exporter/LICENSE
    dst: /usr/share/doc/mongodb-exporter/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/mongodb-exporter/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

name: "keepalived-exporter"
arch: "arm64"
platform: "linux"
version: "v1.7.1"
release: "2"
version_schema: semver
description: Prometheus exporter for keepalived metrics
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "Mehdy"
homepage: https://github.com/mehdy/keepalived-exporter
license: "GPL-3.0"

contents:

  # binaries
  - src: keepalived-exporter/keepalived-exporter
    dst: /usr/bin/keepalived_exporter
    file_info:
      mode: 0755

  # configuration
  - src: src/default
    dst: /etc/default/keepalived_exporter
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/keepalived_exporter.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: keepalived-exporter/LICENSE
    dst: /usr/share/doc/keepalived-exporter/LICENSE
    file_info:
      mode: 0644

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

overrides:
  rpm:
    provides:
      - keepalived_exporter
    replaces:
      - keepalived_exporter

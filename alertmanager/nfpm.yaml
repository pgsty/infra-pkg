name: "alertmanager"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v0.33.1"
release: "1PGSTY"
version_schema: semver
description: Prometheus Alertmanager
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/prometheus/alertmanager"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binaries
  - src: alertmanager/alertmanager
    dst: /usr/bin/alertmanager
    file_info:
      mode: 0755

  - src: alertmanager/amtool
    dst: /usr/bin/amtool
    file_info:
      mode: 0755

  # configuration
  - src: alertmanager/alertmanager.yml
    dst: /etc/alertmanager.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: prometheus

  - src: src/default
    dst: /etc/default/alertmanager
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/alertmanager.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # state
  - dst: /var/lib/alertmanager
    type: dir
    file_info:
      mode: 0750
      owner: prometheus
      group: prometheus

  # documentation
  - src: alertmanager/LICENSE
    dst: /usr/share/doc/alertmanager/LICENSE
    file_info:
      mode: 0644

  - src: alertmanager/NOTICE
    dst: /usr/share/doc/alertmanager/NOTICE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/alertmanager/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

name: "sql-studio"
arch: "${ARCH}"
platform: "linux"
section: "web"
priority: "optional"
version: "v0.1.53"
release: "1PGSTY"
version_schema: semver
description: Terminal SQL database explorer for PostgreSQL, MySQL, SQLite, ClickHouse, and more.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/frectonz/sql-studio"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: sql-studio/sql-studio
    dst: /usr/bin/sql-studio
    file_info:
      mode: 0755

  - src: sql-studio/LICENSE
    dst: /usr/share/doc/sql-studio/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/sql-studio/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

overrides:
  deb:
    depends:
      - "libc6 (>= 2.34)"
      - "libstdc++6 (>= 11)"
  rpm:
    depends:
      - "glibc >= 2.34"
      - "libstdc++ >= 11"

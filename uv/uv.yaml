name: "uv"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "v0.12.17"
release: "1PGSTY"
version_schema: semver
description: An extremely fast Python package and project manager, written in Rust.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/astral-sh/uv"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: uv/uv
    dst: /usr/bin/uv
    file_info:
      mode: 0755

  - src: uv/uvx
    dst: /usr/bin/uvx
    file_info:
      mode: 0755

  - dst: /etc/uv/
    type: dir
    file_info:
      mode: 0755

  - src: src/uv.toml
    dst: /etc/uv/uv.toml
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/uv/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/uv/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

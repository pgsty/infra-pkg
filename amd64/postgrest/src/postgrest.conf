# PostgREST configuration file
# https://postgrest.org/en/stable/references/configuration.html

# Database connection URI is intentionally unset. Configure PGRST_DB_URI in
# /etc/default/postgrest before exposing the service.
# db-uri = "postgres://authenticator:change-me@localhost:5432/dbname"

# Schema(s) to expose
db-schemas = "public"

# Anonymous access remains blocked until a role is explicitly configured.
# db-anon-role = "anon"

# Server settings
server-host = "127.0.0.1"
server-port = 3000

# Connection pool settings
# db-pool = 10
# db-pool-acquisition-timeout = 10

# JWT settings (optional)
# Set jwt-secret to a random value of at least 32 characters.
# jwt-aud = "your-audience"

# OpenAPI settings
# openapi-mode = "follow-privileges"
# openapi-server-proxy-uri = "http://localhost:3000"

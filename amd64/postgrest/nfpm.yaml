name: "postgrest"
arch: "amd64"
platform: "linux"
version: "v14.16"
release: "2"
version_schema: semver
description: PostgREST serves a fully RESTful API from any existing PostgreSQL database.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PostgREST"
homepage: "https://github.com/PostgREST/postgrest"
license: "MIT"

contents:

  # binaries
  - src: postgrest/postgrest
    dst: /usr/bin/postgrest
    file_info:
      mode: 0755

  # configuration
  - dst: /etc/postgrest
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: postgrest

  - src: src/postgrest.conf
    dst: /etc/postgrest/postgrest.conf
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: postgrest

  - src: src/default
    dst: /etc/default/postgrest
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  # service
  - src: src/service
    dst: /usr/lib/systemd/system/postgrest.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: src/LICENSE
    dst: /usr/share/doc/postgrest/LICENSE
    file_info:
      mode: 0644

scripts:
  preinstall:  src/preinstall.sh
  postinstall: src/postinstall.sh
  preremove:   src/preremove.sh
  postremove:  src/postremove.sh

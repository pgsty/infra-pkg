name: "logcli"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v3.6.7"
release: "1PGSTY"
version_schema: semver
description: Command-line interface for querying Grafana Loki
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: https://github.com/grafana/loki
license: "AGPL-3.0-only"
changelog: "${NFPM_CHANGELOG}"

contents:

  # binary
  - src: logcli/logcli.bin
    dst: /usr/bin/logcli
    file_info:
      mode: 0755

  # documentation
  - src: ../LICENSES/AGPL-3.0.txt
    dst: /usr/share/doc/logcli/LICENSE
    file_info:
      mode: 0644

  - src: src/LICENSING.md
    dst: /usr/share/doc/logcli/LICENSING.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/logcli/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "nodejs"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "v24.21.0"
version_schema: semver
release: "1PGSTY"
description: Node.js JavaScript runtime
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://nodejs.org"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: node/
    dst: /usr/lib/nodejs

  - src: node/LICENSE
    dst: /usr/share/doc/nodejs/LICENSE
    file_info:
      mode: 0644

  - src: ../lib/nodejs/bin/node
    dst: /usr/bin/node
    type: symlink
  - src: ../lib/nodejs/bin/node
    dst: /usr/bin/nodejs
    type: symlink
  - src: ../lib/nodejs/bin/npm
    dst: /usr/bin/npm
    type: symlink
  - src: ../lib/nodejs/bin/npx
    dst: /usr/bin/npx
    type: symlink
  - src: ../lib/nodejs/bin/corepack
    dst: /usr/bin/corepack
    type: symlink

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/nodejs/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

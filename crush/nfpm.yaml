name: "crush"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "0.95.0"
release: "1PGSTY"
version_schema: semver
description: Glamorous AI coding agent for the terminal
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/charmbracelet/crush"
license: "FSL-1.1-MIT"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: crush/crush
    dst: /usr/bin/crush
    file_info:
      mode: 0755

  - src: crush/completions/crush.bash
    dst: /usr/share/bash-completion/completions/crush
    file_info:
      mode: 0644

  - src: crush/completions/crush.fish
    dst: /usr/share/fish/vendor_completions.d/crush.fish
    file_info:
      mode: 0644

  - src: crush/completions/crush.zsh
    dst: /usr/share/zsh/site-functions/_crush
    file_info:
      mode: 0644

  - src: crush/manpages/crush.1.gz
    dst: /usr/share/man/man1/crush.1.gz
    file_info:
      mode: 0644

  - src: crush/LICENSE.md
    dst: /usr/share/doc/crush/LICENSE.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/crush/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

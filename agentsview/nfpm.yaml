name: "agentsview"
arch: "${ARCH}"
platform: "linux"
version: "0.39.0"
release: "2"
version_schema: semver
description: Browse, search, and track costs across all your AI coding agents.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "Kenn Software LLC"
homepage: "https://github.com/kenn-io/agentsview"
license: "MIT"

rpm:
  prefixes:
    - /usr

contents:
  - src: agentsview/agentsview
    dst: /usr/bin/agentsview
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/agentsview/LICENSE
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - "libc6 (>= 2.28)"
      - "libstdc++6"
  rpm:
    depends:
      - "glibc >= 2.28"
      - "libstdc++"

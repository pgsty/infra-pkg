name: "timescaledb-tools"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v0.19.0"
release: "1PGSTY"
version_schema: semver
description: "TimescaleDB tuning and parallel copy tools"
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/timescale/timescaledb-tune"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: timescaledb-tune
    dst: /usr/bin/timescaledb-tune
    file_info:
      mode: 0755

  - src: timescaledb-parallel-copy
    dst: /usr/bin/timescaledb-parallel-copy
    file_info:
      mode: 0755

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/timescaledb-tools/LICENSE
    file_info:
      mode: 0644

  - src: NOTICE.timescaledb-tune
    dst: /usr/share/doc/timescaledb-tools/NOTICE.timescaledb-tune
    file_info:
      mode: 0644

  - src: NOTICE.timescaledb-parallel-copy
    dst: /usr/share/doc/timescaledb-tools/NOTICE.timescaledb-parallel-copy
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/timescaledb-tools/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "rainfrog"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v0.4.3"
release: "1PGSTY"
version_schema: semver
description: Database tool for the terminal.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/achristmascarl/rainfrog"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: rainfrog/rainfrog
    dst: /usr/bin/rainfrog
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/rainfrog/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/rainfrog/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "cargo-pgrx-0192"
arch: "${ARCH}"
platform: "linux"
section: "devel"
priority: "optional"
version: "0.19.2"
release: "1PGSTY"
version_schema: semver
description: |
  Versioned cargo-pgrx 0.19.2 command for PGSTY extension builds
  Uses the current packaged Rust toolchain and an isolated PGRX_HOME so exact
  cargo-pgrx patch releases can coexist on one builder.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/pgcentralfoundation/pgrx"
license: "MIT AND LicenseRef-Cargo-Pgrx-Bundled-Third-Party"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: stage/usr/lib/pgsty/cargo-pgrx/0.19.2/bin/cargo-pgrx
    dst: /usr/lib/pgsty/cargo-pgrx/0.19.2/bin/cargo-pgrx
    file_info:
      mode: 0755

  - src: src/cargo-pgrx-0192
    dst: /usr/bin/cargo-pgrx-0192
    file_info:
      mode: 0755

  - src: src/LICENSE
    dst: /usr/share/doc/cargo-pgrx-0192/LICENSE
    file_info:
      mode: 0644

  - src: stage/usr/share/doc/cargo-pgrx-0192/Cargo.lock
    dst: /usr/share/doc/cargo-pgrx-0192/Cargo.lock
    file_info:
      mode: 0644

  - src: stage/usr/share/doc/cargo-pgrx-0192/BUILDINFO
    dst: /usr/share/doc/cargo-pgrx-0192/BUILDINFO
    file_info:
      mode: 0644

  - src: stage/usr/share/doc/cargo-pgrx-0192/ELF-ABI.txt
    dst: /usr/share/doc/cargo-pgrx-0192/ELF-ABI.txt
    file_info:
      mode: 0644

  - src: stage/usr/share/doc/cargo-pgrx-0192/CARGO-METADATA.json
    dst: /usr/share/doc/cargo-pgrx-0192/CARGO-METADATA.json
    file_info:
      mode: 0644

  - src: stage/usr/share/doc/cargo-pgrx-0192/THIRD-PARTY-METADATA.tsv
    dst: /usr/share/doc/cargo-pgrx-0192/THIRD-PARTY-METADATA.tsv
    file_info:
      mode: 0644

  - src: stage/usr/share/doc/cargo-pgrx-0192/THIRD-PARTY-LICENSES.txt
    dst: /usr/share/doc/cargo-pgrx-0192/THIRD-PARTY-LICENSES.txt
    file_info:
      mode: 0644

  - src: stage/usr/share/man/man1/cargo-pgrx-0192.1.gz
    dst: /usr/share/man/man1/cargo-pgrx-0192.1.gz
    file_info:
      mode: 0644

  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/cargo-pgrx-0192/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

overrides:
  deb:
    depends:
      - "ca-certificates"
      - "libc6 (>= ${GLIBC_FLOOR})"
      - "libgcc-s1"
      - "rust-toolchain (>= ${RUST_MIN_VERSION})"
  rpm:
    depends:
      - "ca-certificates"
      - "glibc >= ${GLIBC_FLOOR}"
      - "libgcc"
      - "rust-toolchain >= ${RUST_MIN_VERSION}"

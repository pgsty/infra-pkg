name: "pg-timetable"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v7.0.0"
release: "1PGSTY"
version_schema: semver
description: "Advanced scheduling for PostgreSQL"
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/cybertec-postgresql/pg_timetable"
license: "PostgreSQL"
changelog: "${NFPM_CHANGELOG}"

contents:

  - src: pg_timetable/pg_timetable
    dst: /usr/bin/pg_timetable
    file_info:
      mode: 0755

  - src: pg_timetable/LICENSE
    dst: /usr/share/doc/pg-timetable/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/pg-timetable/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

rpm:
  prefixes:
    - /usr/bin

name: "pev2"
arch: "all"
platform: "linux"
section: "web"
priority: "optional"
version: "v1.23.0"
release: "1PGSTY"
version_schema: semver
description: "PostgreSQL Explain Visualizer"
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/dalibo/pev2"
license: "PostgreSQL"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: pev2.html
    dst: /usr/share/pev2.html
    type: file
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/doc/pev2/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/pev2/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

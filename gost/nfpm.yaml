name: "gost"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v2.12.0"
release: "1PGSTY"
version_schema: semver
description: GO Simple Tunnel
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/ginuerzh/gost"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: gost/gost
    dst: /usr/bin/gost
    file_info:
      mode: 0755

  - src: gost/LICENSE
    dst: /usr/share/doc/gost/LICENSE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/gost/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

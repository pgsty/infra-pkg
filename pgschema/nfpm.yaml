name: "pgschema"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "1.12.2"
release: "1PGSTY"
version_schema: semver
description: PostgreSQL declarative schema migration tool
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://www.pgschema.com"
license: "Apache-2.0"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: pgschema/pgschema
    dst: /usr/bin/pgschema
    file_info:
      mode: 0755

  - src: ../LICENSES/Apache-2.0.txt
    dst: /usr/share/doc/pgschema/LICENSE
    file_info:
      mode: 0644

  - src: NOTICE
    dst: /usr/share/doc/pgschema/NOTICE
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/pgschema/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

name: "headscale"
arch: "${ARCH}"
platform: "linux"
section: "net"
priority: "optional"
version: "v0.29.3"
release: "1PGSTY"
version_schema: semver
description: An open source, self-hosted implementation of the Tailscale control server
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/juanfont/headscale"
license: "BSD-3-Clause"
changelog: "${NFPM_CHANGELOG}"

contents:
  - src: headscale/headscale
    dst: /usr/bin/headscale
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/headscale/LICENSE
    file_info:
      mode: 0644

  - dst: /etc/headscale/
    type: dir
    file_info:
      mode: 0755

  - dst: /var/lib/headscale/
    type: dir
    file_info:
      mode: 0755

  - src: src/config.yaml
    dst: /etc/headscale/config.yaml
    type: config|noreplace
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/headscale/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root

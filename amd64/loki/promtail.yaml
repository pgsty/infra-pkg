name: "promtail"
arch: "amd64"
platform: "linux"
version: "v3.6.7"
release: "2"
version_schema: semver
description: Promtail Logging Agent
maintainer: Ruohang Feng <rh@vonng.com>
vendor: Grafana
homepage: https://github.com/grafana/loki
license: "AGPL-3.0-only"

contents:

  # binaries
  - src: loki/promtail-linux-amd64
    dst: /usr/bin/promtail
    file_info:
      mode: 0755

  # configuration
  - src: src/promtail.yml
    dst: /etc/promtail.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  - src: src/promtail.default
    dst: /etc/default/promtail
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

  # service
  - src: src/promtail.service
    dst: /usr/lib/systemd/system/promtail.service
    file_info:
      mode: 0644
      owner: root
      group: root

  # documentation
  - src: src/LICENSE
    dst: /usr/share/doc/promtail/LICENSE
    file_info:
      mode: 0644

  - src: src/LICENSING.md
    dst: /usr/share/doc/promtail/LICENSING.md
    file_info:
      mode: 0644

scripts:
  preinstall:  src/promtail-preinstall.sh
  postinstall: src/promtail-postinstall.sh
  preremove:   src/promtail-preremove.sh
  postremove:  src/promtail-postremove.sh

overrides:
  deb:
    depends:
      - "libc6 (>= 2.34)"
  rpm:
    depends:
      - "glibc >= 2.34"

name: "sqlcmd"
arch: "${ARCH}"
platform: "linux"
section: "database"
priority: "optional"
version: "v1.10.0"
release: "1PGSTY"
version_schema: semver
description: Cross-platform command-line client for SQL Server and Azure SQL.
maintainer: Ruohang Feng <rh@vonng.com>
vendor: "PGSTY"
homepage: "https://github.com/microsoft/go-sqlcmd"
license: "MIT"
changelog: "${NFPM_CHANGELOG}"

rpm:
  prefixes:
    - /usr/bin

contents:
  - src: sqlcmd/sqlcmd
    dst: /usr/bin/sqlcmd
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/sqlcmd/LICENSE
    file_info:
      mode: 0644

  - src: sqlcmd/NOTICE.md
    dst: /usr/share/doc/sqlcmd/NOTICE.md
    file_info:
      mode: 0644

  # Debian documentation
  - src: "${NFPM_COPYRIGHT}"
    dst: /usr/share/doc/sqlcmd/copyright
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root
